name: Deploy JHS Imobiliaria to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir app
          unzip -q imobiliaria-main.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages base path
        working-directory: app/imobiliaria-main
        run: |
          python3 - <<'PY'
          p='vite.config.ts'
          s=open(p).read()
          if "base: '/jhsimobiliaria/'" not in s:
              s=s.replace("return {", "return {\n    base: '/jhsimobiliaria/',", 1)
          open(p,'w').write(s)
          PY
      - name: Align Vite build dependency
        working-directory: app/imobiliaria-main
        run: npm pkg set devDependencies.esbuild="^0.28.0"
      - name: Install dependencies
        working-directory: app/imobiliaria-main
        run: npm install
      - name: Build
        working-directory: app/imobiliaria-main
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/imobiliaria-main/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
